  <!-- side cap -->
  <path d="M40 26 q10 -12 21 -3 q-1 5 -3 6 q-9 -5 -18 1z" fill="#565b48"/>
  <path d="M40 26 q10 -3 20 2 l0 3 q-10 -4 -20 -1z" fill="#3e4234"/>
