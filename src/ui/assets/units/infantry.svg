      <stop offset="0" stop-color="#20261b"/>
      <stop offset="0.62" stop-color="#12150e"/>
      <stop offset="1" stop-color="#0b0d08"/>
    </linearGradient>
    <linearGradient id="u-inf-coat" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7f846a"/>
      <stop offset="1" stop-color="#4f5442"/>
