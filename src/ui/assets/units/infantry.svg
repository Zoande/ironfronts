  </defs>
  <rect width="100" height="100" fill="url(#u-inf-bg)"/>
  <path d="M0 70h100v30H0z" fill="#0e100c" opacity="0.55"/>
  <ellipse cx="50" cy="88" rx="30" ry="6" fill="#000" opacity="0.35"/>
  <!-- rifle, slung across the body -->
  <path d="M22 78 L74 40" stroke="#26241d" stroke-width="4.4" stroke-linecap="round"/>
  <path d="M22 78 L74 40" stroke="#3d3a2d" stroke-width="1.8" stroke-linecap="round"/>
  <path d="M70 43 l9 -6" stroke="#1c1a15" stroke-width="2.6" stroke-linecap="round"/>
  <!-- legs -->
  <path d="M41 62 l-4 26 h9 l3 -22z" fill="#43483a"/>
  <path d="M52 62 l4 26 h-9 l-3 -22z" fill="#4c5142"/>
  <path d="M33 88 h13 v5 h-15z" fill="#211f19"/>
  <path d="M54 88 h13 v5 h-15z" fill="#26241d"/>
  <!-- torso / greatcoat -->
  <path d="M34 40 q16 -10 32 0 l3 26 q-19 8 -38 0z" fill="url(#u-inf-coat)"/>
