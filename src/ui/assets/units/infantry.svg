  <rect x="46" y="30" width="8" height="8" rx="2" fill="#8a7f66"/>
  <!-- helmet -->
  <path d="M38 30 q1 -15 12 -16 q11 1 12 16 q-12 5 -24 0z" fill="#5a5f4c"/>
  <path d="M38 30 q1 -15 12 -16 q4 0 6 1 q-7 3 -8 15 q-6 1 -10 -1z" fill="#727863"/>
  <path d="M37 30 q13 6 26 0 l0 3 q-13 6 -26 0z" fill="#3e4234"/>
